services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nuzzle
      POSTGRES_USER: nuzzle
      POSTGRES_PASSWORD: nuzzle_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nuzzle-postgres:/var/lib/postgresql/data
      - ./server/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuzzle -d nuzzle"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  nuzzle-postgres:

