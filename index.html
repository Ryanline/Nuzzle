<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f2e9" />
    <meta name="description" content="Nuzzle — a calm daily monster-battling puzzle." />
    <title>Nuzzle — Daily battle puzzle</title>
    <link rel="preconnect" href="https://play.pokemonshowdown.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <header class="site-header">
        <button class="brand" type="button" data-route="today" aria-label="Nuzzle home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" role="img"><path d="M8 22c0-8 5-14 12-14 8 0 12 6 12 13 0 8-5 12-12 12-7 0-12-4-12-11Z"/><path class="brand-sprout" d="M20 9c1-5 5-7 10-6-1 5-4 8-10 8M19 10c-2-4-6-5-10-3 2 4 5 6 10 5"/></svg>
          </span>
          <span>Nuzzle</span>
        </button>
        <nav class="main-nav" aria-label="Primary navigation">
          <button type="button" data-route="today" aria-current="page">Today</button>
          <button type="button" data-route="encounters">Encounters <span id="encounterBadge" class="nav-badge"></span></button>
          <button type="button" data-route="pc">PC</button>
          <button type="button" data-route="shop">Shop</button>
        </nav>
        <button class="streak-chip" type="button" data-route="records" aria-label="View records">
          <span aria-hidden="true">🔥</span><strong id="streakCount">0</strong><span>day streak</span>
        </button>
      </header>

      <main id="main" tabindex="-1">
        <section id="todayView" class="view" data-view="today"></section>
        <section id="encountersView" class="view" data-view="encounters" hidden></section>
        <section id="pcView" class="view" data-view="pc" hidden></section>
        <section id="shopView" class="view" data-view="shop" hidden></section>
        <section id="recordsView" class="view" data-view="records" hidden></section>
      </main>

      <footer>
        <p>An independent fan project. Not affiliated with Nintendo, Game Freak, Creatures, or The Pokémon Company.</p>
        <button type="button" id="resetPreview">Reset local preview</button>
      </footer>
    </div>

    <dialog id="detailDialog" class="dialog"></dialog>
    <dialog id="leadDialog" class="dialog"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="game-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
